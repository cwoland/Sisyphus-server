name: reminders

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Проверить настройки
        run: |
          missing=
          [ -n "$API_URL" ]     || missing="$missing API_URL"
          [ -n "$CRON_SECRET" ] || missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Не заданы:$missing — Settings → Secrets and variables → Actions"
            exit 1
          fi
          case "$API_URL" in
            http://*|https://*) ;;
            *) echo "::error::API_URL должен начинаться с https:// — сейчас «$API_URL»"; exit 1 ;;
          esac
          echo "API_URL = $API_URL"

      - name: Разбудить API
        run: |
          curl -sS --max-time 180 --retry 4 --retry-all-errors --retry-delay 15 \
            -o /dev/null -w 'пробуждение: HTTP %{http_code} за %{time_total}s\n' \
            "${API_URL%/}/api/push/public-key"

      - name: Отправить напоминания
        run: |
          code=$(curl -sS --max-time 180 --retry 2 --retry-all-errors \
            -o response.json -w '%{http_code}' \
            -X POST "${API_URL%/}/api/push/trigger-reminders" \
            -H "x-cron-secret: $CRON_SECRET")
          cat response.json; echo
          case "$code" in
            200) ;;
            401) echo "::error::401 — CRON_SECRET не совпадает со значением на сервере"; exit 1 ;;
            *)   echo "::error::Ожидался 200, пришёл $code"; exit 1 ;;
          esac